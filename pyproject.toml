[project]
name = "agentnet"
version = "0.1.0"
description = "Agent-to-agent referral network. MCP server + HTTP API."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
